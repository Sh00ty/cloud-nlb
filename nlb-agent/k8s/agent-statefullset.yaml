apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nlb-agent
  namespace: cloud-nlb
spec:
  serviceName: nlb-agent-headless
  replicas: 6
  selector:
    matchLabels:
      app: nlb-agent
  template:
    metadata:
      labels:
        app: nlb-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - "host.docker.internal"
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nlb-agent
          image: nlb-agent:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nlb-agent-config
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
              name: probes
            - containerPort: 8081
              name: metrics
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}