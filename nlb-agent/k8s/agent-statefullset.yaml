apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nlb-agent
  namespace: cloud-nlb
spec:
  serviceName: nlb-agent-headless
  replicas: 4
  selector:
    matchLabels:
      app: nlb-agent
  template:
    metadata:
      labels:
        app: nlb-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - "host.docker.internal"
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nlb-agent
          image: nlb-agent:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nlb-agent-config
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
              name: probes
            - containerPort: 8081
              name: metrics
            - containerPort: 10000
              name: test-traffic
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            capabilities:
              add:
              - NET_ADMIN
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: tmp-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nlb-vip-test-server
  namespace: cloud-nlb
spec:
  type: ClusterIP
  selector:
    app: nlb-agent
  ports:
    - name: traffic
      port: 10000
      targetPort: 10000
      protocol: TCP